name: Build Dicta EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-code-only:
    name: Build DictaProtocol Windows code-only package
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Prepare local whisper.cpp backend without models
        run: |
          $ErrorActionPreference = "Stop"
          $version = "v1.8.4"
          $url = "https://github.com/ggml-org/whisper.cpp/releases/download/$version/whisper-bin-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "whisper-bin-x64-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "whisper-bin-x64-$version"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $release = Join-Path $extract "Release"
          $required = @("whisper-cli.exe", "whisper.dll", "ggml.dll", "ggml-base.dll", "ggml-cpu.dll")
          foreach ($file in $required) {
            $source = Join-Path $release $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required whisper.cpp release file was not found: $file"
            }
          }
          foreach ($backend in @("compat", "avx2")) {
            $destination = ".tools\whisper.cpp-build-$backend\bin"
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Remove-Item -Path (Join-Path $destination "*") -Recurse -Force -ErrorAction SilentlyContinue
            foreach ($file in $required) {
              Copy-Item -LiteralPath (Join-Path $release $file) -Destination $destination -Force
            }
          }
          New-Item -ItemType Directory -Force -Path "models" | Out-Null
          Write-Host "Prepared whisper.cpp release binaries for CI package."

      - name: Build DictaProtocol package without models
        run: .\scripts\build_dicta_exe.ps1 -SkipModels -PackageVersion "1.1-pilot-protocol-code-only" -DistRoot "dist\DictaProtocol"

      - name: Create artifact archive
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "dist\DictaProtocol\*" -DestinationPath artifacts\DictaProtocol-windows-code-only.zip -Force
          Get-Item -LiteralPath artifacts\DictaProtocol-windows-code-only.zip | Format-List FullName,Length,LastWriteTime

      - name: Upload DictaProtocol package
        uses: actions/upload-artifact@v4
        with:
          name: DictaProtocol-windows-code-only
          path: artifacts/DictaProtocol-windows-code-only.zip
          if-no-files-found: error
          retention-days: 30
