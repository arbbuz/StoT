name: Build Dicta EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-code-only:
    name: Build Windows code-only package
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Prepare local whisper.cpp backend without models
        run: .\scripts\prepare_dicta_assets.ps1 -SkipModels

      - name: Build Dicta package without models
        run: .\scripts\build_dicta_exe.ps1 -SkipModels -PackageVersion "1.1-pilot-code-only"

      - name: Create artifact archive
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -LiteralPath dist\Dicta\* -DestinationPath artifacts\Dicta-windows-code-only.zip -Force
          Get-Item -LiteralPath artifacts\Dicta-windows-code-only.zip | Format-List FullName,Length,LastWriteTime

      - name: Upload Dicta package
        uses: actions/upload-artifact@v4
        with:
          name: Dicta-windows-code-only
          path: artifacts/Dicta-windows-code-only.zip
          if-no-files-found: error
          retention-days: 30
